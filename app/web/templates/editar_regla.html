{% extends "base.html" %}

{% block title %}
Editar regla
{% endblock %}

{% block content %}

    <title>Editar regla</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

<h1>✏️ Editar regla</h1>

<form method="POST"
      action="/reglas/{{ regla.id }}/update">

    <label>Evento</label>
    <input name="evento"
           class="form-control"
           value="{{ regla.evento }}">

    <label>Estado destino</label>
    <input name="estado_destino"
           class="form-control"
           value="{{ regla.estado_destino }}">

    <label>Template</label>
    <input name="template"
           class="form-control"
           value="{{ regla.template }}">

    <label>Días plazo</label>
    <input name="dias_plazo"
           class="form-control"
           value="{{ regla.dias_plazo }}">

    <br>

    <button class="btn btn-success">
        Guardar
    </button>

</form>

{% endblock %}
